  <line x1="120" y1="160" x2="160" y2="160" stroke="#0b3d91" stroke-width="2" marker-end="url(#p)"/>

  <circle cx="180" cy="160" r="20" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="180" y="166" text-anchor="middle" font-size="18" fill="#0b3d91">Σ</text>
  <text x="168" y="150" font-size="14" fill="#c0392b">+</text>
  <text x="168" y="200" font-size="14" fill="#c0392b">−</text>

  <line x1="200" y1="160" x2="245" y2="160" stroke="#0b3d91" stroke-width="2" marker-end="url(#p)"/>
  <text x="222" y="150" text-anchor="middle" font-size="12" fill="#555">误差 e</text>

  <rect x="250" y="135" width="110" height="50" rx="6" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="305" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d91">PID</text>
  <text x="305" y="176" text-anchor="middle" font-size="10" fill="#555">Kp/Ki/Kd+抗饱和</text>

  <line x1="360" y1="160" x2="405" y2="160" stroke="#0b3d91" stroke-width="2" marker-end="url(#p)"/>
  <text x="382" y="150" text-anchor="middle" font-size="11" fill="#555">占空比</text>

  <rect x="410" y="135" width="120" height="50" rx="6" fill="#fff6ea" stroke="#b9770e" stroke-width="2"/>
  <text x="470" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#b9770e">PWM+TB6612</text>
  <text x="470" y="176" text-anchor="middle" font-size="10" fill="#555">功率驱动</text>

  <line x1="530" y1="160" x2="575" y2="160" stroke="#0b3d91" stroke-width="2" marker-end="url(#p)"/>

  <rect x="580" y="135" width="110" height="50" rx="6" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="635" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">直流电机</text>
  <text x="635" y="176" text-anchor="middle" font-size="10" fill="#555">被控对象</text>

  <line x1="690" y1="160" x2="740" y2="160" stroke="#0b3d91" stroke-width="2"/>
  <text x="748" y="164" font-size="13" fill="#333">转速</text>

  <!-- feedback -->
  <line x1="715" y1="160" x2="715" y2="250" stroke="#1e8449" stroke-width="2"/>
  <rect x="560" y="230" width="150" height="42" rx="6" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="635" y="252" text-anchor="middle" font-size="12" fill="#1e8449">编码器测速</text>
  <text x="635" y="267" text-anchor="middle" font-size="10" fill="#555">counts→rpm(x4)</text>
  <line x1="715" y1="251" x2="710" y2="251" stroke="#1e8449" stroke-width="2"/>
  <line x1="560" y1="251" x2="180" y2="251" stroke="#1e8449" stroke-width="2"/>
  <line x1="180" y1="251" x2="180" y2="182" stroke="#1e8449" stroke-width="2" marker-end="url(#p)"/>
  <text x="360" y="245" text-anchor="middle" font-size="11" fill="#1e8449">实测转速反馈</text>

  <rect x="120" y="292" width="580" height="30" rx="6" fill="#f2f6ff" stroke="#9bb0d0"/>
