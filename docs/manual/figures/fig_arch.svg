<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b3d91"/></marker></defs>
  <rect x="1" y="1" width="818" height="598" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d91">系统总体架构:异构双核 + OpenAMP/RPMsg</text>

  <rect x="120" y="52" width="580" height="56" rx="8" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="410" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">浏览器客户端(Chart.js 实时曲线 · 调速滑块 · 在线整定 PID · 启停)</text>
  <text x="410" y="97" text-anchor="middle" font-size="12" fill="#333">WebSocket</text>

  <rect x="90" y="132" width="640" height="150" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="410" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3d91">A7 核 / Linux —— 智能与连接</text>
  <rect x="115" y="170" width="270" height="44" rx="5" fill="#fff" stroke="#5b8def"/><text x="250" y="188" text-anchor="middle" font-size="12">bridge.py(Flask+flask-sock)</text><text x="250" y="205" text-anchor="middle" font-size="11" fill="#555">RPMsg ↔ WebSocket 桥接</text>
  <rect x="405" y="170" width="300" height="44" rx="5" fill="#fff" stroke="#5b8def"/><text x="555" y="188" text-anchor="middle" font-size="12">remoteproc(加载/启停 M4 固件)</text><text x="555" y="205" text-anchor="middle" font-size="11" fill="#555">/dev/ttyRPMSG0</text>
  <rect x="115" y="224" width="590" height="42" rx="5" fill="#f7f0ff" stroke="#7d3c98"/><text x="410" y="250" text-anchor="middle" font-size="12" fill="#7d3c98">(可选)IIO 读 MPU-6050 振动/倾角 → 同一面板</text>

  <text x="410" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#b9770e">OpenAMP / RPMsg 双向消息通道</text>

  <rect x="90" y="320" width="640" height="150" rx="8" fill="#fff6ea" stroke="#b9770e" stroke-width="2"/>
  <text x="410" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#b9770e">M4 核 / 裸机 —— 硬实时控制大脑</text>
  <rect x="150" y="360" width="520" height="42" rx="5" fill="#fff" stroke="#e0a63a"/><text x="410" y="386" text-anchor="middle" font-size="12">1 kHz 控制中断:encoder_update → pid_update → motor_pwm_set</text>
  <rect x="150" y="410" width="250" height="42" rx="5" fill="#fff" stroke="#e0a63a"/><text x="275" y="436" text-anchor="middle" font-size="12">50 Hz 遥测上行</text>
  <rect x="420" y="410" width="250" height="42" rx="5" fill="#fff" stroke="#e0a63a"/><text x="545" y="436" text-anchor="middle" font-size="12">堵转 / 失联保护</text>

  <rect x="220" y="500" width="380" height="52" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="524" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">TB6612 H 桥 → 直流电机(+ 正交编码器)</text>
  <text x="410" y="542" text-anchor="middle" font-size="11" fill="#555">PWM+方向 下行;编码器 A/B 上行</text>

  <line x1="410" y1="108" x2="410" y2="132" stroke="#0b3d91" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="282" x2="410" y2="320" stroke="#b9770e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="470" x2="410" y2="500" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
</svg>
