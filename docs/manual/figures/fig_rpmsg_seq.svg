<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0b3d91"/></marker>
  <marker id="s2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#b9770e"/></marker></defs>
  <rect x="1" y="1" width="818" height="438" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d91">remoteproc 加载 + RPMsg 通信时序</text>

  <g font-size="12" font-weight="bold" fill="#0b3d91">
    <text x="150" y="64" text-anchor="middle">A7:remoteproc</text>
    <text x="360" y="64" text-anchor="middle">A7:bridge.py</text>
    <text x="620" y="64" text-anchor="middle">M4 固件</text>
  </g>
  <g stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="150" y1="74" x2="150" y2="410"/><line x1="360" y1="74" x2="360" y2="410"/><line x1="620" y1="74" x2="620" y2="410"/>
  </g>

  <line x1="150" y1="100" x2="620" y2="100" stroke="#0b3d91" stroke-width="2" marker-end="url(#s)"/>
  <text x="385" y="94" text-anchor="middle" font-size="12">① 写 firmware + state=start(加载并启动 M4)</text>
  <line x1="620" y1="132" x2="150" y2="132" stroke="#0b3d91" stroke-width="2" marker-end="url(#s)"/>
  <text x="385" y="126" text-anchor="middle" font-size="12">② M4 建 RPMsg 通道 → 出现 /dev/ttyRPMSG0</text>

  <line x1="360" y1="170" x2="620" y2="170" stroke="#b9770e" stroke-width="2" marker-end="url(#s2)"/>
  <text x="490" y="164" text-anchor="middle" font-size="12" fill="#b9770e">③ 写 "SPD 1200"</text>
  <line x1="620" y1="205" x2="360" y2="205" stroke="#1e8449" stroke-width="2" marker-end="url(#s)"/>
  <text x="490" y="199" text-anchor="middle" font-size="12" fill="#1e8449">④ 遥测 "T ms rpm ..."(50 Hz 循环)</text>

  <rect x="120" y="235" width="580" height="120" rx="8" fill="none" stroke="#c0392b" stroke-dasharray="6 4"/>
  <text x="150" y="252" font-size="12" fill="#c0392b" font-weight="bold">稳态运行循环</text>
  <line x1="360" y1="280" x2="620" y2="280" stroke="#b9770e" stroke-width="2" marker-end="url(#s2)"/>
  <text x="490" y="274" text-anchor="middle" font-size="12" fill="#b9770e">滑块变化 → "SPD/PID/RUN"</text>
  <line x1="620" y1="315" x2="360" y2="315" stroke="#1e8449" stroke-width="2" marker-end="url(#s)"/>
  <text x="490" y="309" text-anchor="middle" font-size="12" fill="#1e8449">周期遥测 → 浏览器曲线</text>
  <text x="620" y="345" text-anchor="middle" font-size="11" fill="#c0392b">M4 内部:1 kHz PID 闭环持续运行</text>

  <text x="410" y="392" text-anchor="middle" font-size="12" fill="#555">失联:超 1 s 无下行命令 → M4 进安全态(停机);A7 侧断线自动重连</text>
  <text x="410" y="412" text-anchor="middle" font-size="11" fill="#888">对照 IIO:remoteproc 之于 M4,类比 insmod 之于内核模块</text>
</svg>
